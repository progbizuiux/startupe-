    Only the mark, not the lockup. The full logo is 4:1 with an "AN INITIATIVE
    BY SHAFI PARAMBIL MP" line under it, and at 32px that is an illegible smear.

    Dark tile, and the mark taken from the REVERSED artboard: the "e" is a white
    hexagon and the "+" is the bright lime, so on a light tile the "e" would
    vanish. Dark also holds up against both light and dark browser chrome.

